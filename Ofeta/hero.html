<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pirx.rent – Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <section class="hero">
    <div class="container hero__inner">
      <div class="hero__text">
        <h1 class="hero__title">Pełna obsługa nieruchomości<br>-od startu do lądowania.</h1>
        <p class="hero__lead">Dwa, trzy zdania o tym, co robi Pirx i dla kogo. Tu wchodzi zdanie pozycjonujące, które dostaniemy od klienta – na razie tekst ma tylko właściwą długość.</p>
        <div class="btn-group">
          <a class="btn btn--yellow" href="#"><i class="fa-solid fa-phone-volume"></i> Umów rozmowę</a>
          <a class="btn btn--outline" href="#"><i class="fa-regular fa-calendar"></i> Oblicz przychód</a>
        </div>
      </div>
      <div class="hero__image">
        <img src="img/hero-panel.svg" alt="Ilustracja panelu sterowania">
      </div>
    </div>
  </section>
