<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pirx – Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:opsz,wght@6..72,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1c17;--yellow:#ffd000;--bg:#fff;--serif:"Newsreader",Georgia,serif;--sans:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg)}
.hero{max-width:1240px;margin:0 auto;min-height:620px;padding:60px 24px;display:grid;grid-template-columns:1fr 390px;align-items:center;gap:48px}
h1{font-family:var(--serif);font-weight:700;font-size:48px;line-height:57px;letter-spacing:-.01em}
.lead{margin-top:27px;max-width:600px;font-size:15px;line-height:26px}
.cta{margin-top:60px;display:flex;flex-wrap:wrap;gap:16px}
.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:8px;font:600 14px var(--sans);color:var(--ink);text-decoration:none;border:1px solid transparent;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn--yellow{background:var(--yellow)}
.btn--line{border-color:var(--ink);background:transparent;font-weight:500}
.art{width:390px;height:390px}
@media(max-width:960px){.hero{grid-template-columns:1fr;padding:48px 20px}.art{width:100%;max-width:390px;height:auto;order:-1}h1{font-size:38px;line-height:46px}h1 br{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/><path d="M15 3a6 6 0 0 1 6 6M15 7a2 2 0 0 1 2 2"/></symbol>
  <symbol id="i-calc" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M4 8h16M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></symbol>
  <!-- manometer -->
  <symbol id="gauge" viewBox="-50 -50 100 100">
    <circle r="47" fill="#fff" stroke="#1f1c17" stroke-width="3"/>
    <circle r="41" fill="none" stroke="#1f1c17" stroke-width="1.2"/>
    <circle r="35" fill="none" stroke="#1f1c17" stroke-width="5" stroke-dasharray="1 7.6" transform="rotate(-100)"/>
    <path d="M-47 0A47 47 0 0 1 0 -47" fill="none" stroke="#1f1c17" stroke-width="5" stroke-dasharray="1 2"/>
    <path d="M0 0L9 -28" stroke="#1f1c17" stroke-width="1.6"/>
    <circle r="3" fill="#fff" stroke="#1f1c17" stroke-width="1.4"/>
  </symbol>
</svg>

<section class="hero">
  <div>
    <h1>Pełna obsługa<br>nieruchomości<br>-od startu do lądowania.</h1>
    <p class="lead">Dwa, trzy zdania o tym, co robi Pirx i dla kogo. Tu wchodzi zdanie pozycjonujące, które dostaniemy od klienta – na razie tekst ma tylko właściwą długość.</p>
    <div class="cta">
      <a class="btn btn--yellow" href="#kontakt"><svg><use href="#i-phone"/></svg>Umów rozmowę</a>
      <a class="btn btn--line" href="#kalkulator"><svg><use href="#i-calc"/></svg>Oblicz przychód</a>
    </div>
  </div>

  <!-- ilustrácia: ovládací panel -->
  <svg class="art" viewBox="0 0 390 390" fill="none" stroke="#1f1c17" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
    <rect x="1" y="1" width="388" height="388" rx="12" stroke-width="2.6" fill="#fff"/>
    <rect x="5" y="5" width="380" height="380" rx="9" stroke-width=".8"/>
    <path d="M4 148h382M195 4v294M4 297h382"/>
    <!-- radar -->
    <use href="#gauge" x="36" y="13" width="128" height="128"/>
    <circle cx="100" cy="77" r="26" stroke-dasharray="3 3" stroke-width=".8"/>
    <circle cx="100" cy="77" r="42" stroke-dasharray="3 3" stroke-width=".8"/>
    <path d="M100 77h42M100 77l42-12M100 77l42-6M100 77l42 0" stroke-width=".8"/>
    <circle cx="88" cy="68" r="4" fill="#1f1c17"/>
    <!-- panel + hodinový ukazovateľ -->
    <rect x="205" y="13" width="172" height="128" rx="8"/>
    <circle cx="214" cy="22" r="2.5"/><circle cx="214" cy="132" r="2.5"/><circle cx="368" cy="132" r="2.5"/><circle cx="368" cy="22" r="2.5"/>
    <circle cx="223" cy="66" r="7" fill="#1f1c17" opacity=".55"/><circle cx="223" cy="90" r="7"/>
    <use href="#gauge" x="250" y="14" width="120" height="120"/>
    <path d="M310 77l-12 12M310 77l8 16" stroke-width="2.4"/>
    <path d="M232 36h-20M232 42h-12" stroke-width=".8"/>
    <!-- spodný ukazovateľ -->
    <use href="#gauge" x="66" y="165" width="100" height="100"/>
    <path d="M116 225l8-28" stroke-width="2.4"/>
    <rect x="98" y="268" width="36" height="14" rx="3"/><path d="M104 275h24"/>
    <!-- gombíky -->
    <circle cx="38" cy="222" r="8"/><circle cx="234" cy="222" r="8"/>
    <path d="M24 196h28M24 244h28M220 196h28M220 244h28" stroke-width=".8"/>
    <!-- posuvník -->
    <rect x="272" y="160" width="80" height="130" rx="4" stroke-width="2"/>
    <rect x="282" y="168" width="48" height="112" rx="2"/>
    <path d="M288 184h18M288 200h12M288 216h18M288 232h12M288 248h18M330 168v112M338 168v112" stroke-width=".9"/>
    <!-- prepínače -->
    <g fill="#fff">
      <rect x="34" y="332" width="50" height="20" rx="4" stroke-width="2"/><rect x="102" y="332" width="50" height="20" rx="4" stroke-width="2"/><rect x="170" y="332" width="50" height="20" rx="4" stroke-width="2"/><rect x="238" y="332" width="50" height="20" rx="4" stroke-width="2"/><rect x="306" y="332" width="50" height="20" rx="4" stroke-width="2"/>
    </g>
    <g fill="#1f1c17" opacity=".7">
      <rect x="53" y="358" width="12" height="12"/><rect x="121" y="358" width="12" height="12"/><rect x="189" y="358" width="12" height="12"/><rect x="257" y="358" width="12" height="12"/><rect x="325" y="358" width="12" height="12"/>
    </g>
    <path d="M12 374h366" stroke-width=".8"/>
  </svg>
</section>
</body>
</html>
