<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pirx.rent – CTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="cta">
    <img class="cta__stars" src="img/stars.svg" alt="" aria-hidden="true">
    <img class="cta__planet cta__planet--big" src="img/planet-big.svg" alt="" aria-hidden="true">
    <img class="cta__planet cta__planet--small" src="img/planet-small.svg" alt="" aria-hidden="true">

    <div class="container cta__inner">
      <h2 class="cta__title">Zacznij od 15 minut.</h2>
      <p class="cta__lead">Rozmowa jest bezpłatna i nie kończy się niczym, do czego trzeba się zobowiązać.<br>Wychodzisz z niej z wyliczeniem na piśmie.</p>
      <div class="btn-group btn-group--center">
        <a class="btn btn--yellow" href="#"><i class="fa-solid fa-phone-volume"></i> Umów rozmowę</a>
        <a class="btn btn--white" href="#"><i class="fa-regular fa-calendar"></i> Oblicz przychód</a>
      </div>
    </div>
  </section>
</body>
</html>
